[package]
name = "soundthis"
version = "0.2.0"
edition = "2021"
authors = ["rvs"]
description = "Real-time desktop audio streaming server for Omarchy"
license = "MIT"

[lib]
name = "soundthis"
path = "src/lib.rs"

[[bin]]
name = "soundthis"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.9.0", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
rcgen = "0.14"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0"
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
