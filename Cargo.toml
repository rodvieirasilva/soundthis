[package]
name = "soundthis"
version = "0.5.0"
edition = "2021"
authors = ["Rodrigo Vieira <rodvieirasilva@gmail.com>"]
description = "Real-time desktop audio streaming server for Omarchy"
license = "MIT"

[lib]
name = "soundthis"
path = "src/lib.rs"

[[bin]]
name = "soundthis"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.9.0", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
rcgen = "0.14"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
anyhow = "1.0"
async-trait = "0.1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
utoipa = "6.0"
utoipa-swagger-ui = { version = "10.0", features = ["axum", "vendored"] }
gtk4 = { version = "0.9", optional = true }
adw = { version = "0.7", package = "libadwaita", optional = true }

[features]
default = ["gui"]
gui = ["dep:gtk4", "dep:adw"]

[dev-dependencies]
tokio = { version = "1.43", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
