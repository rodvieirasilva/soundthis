name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio-utils libpulse-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Bundle
        run: |
          cd web
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release Assets
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ARCHIVE="soundthis-${TAG_NAME}-x86_64-linux.tar.gz"
          
          mkdir -p dist/package
          cp target/release/soundthis dist/package/
          cp README.md dist/package/
          cp LICENSE dist/package/
          cp -r systemd dist/package/
          cp -r plugin dist/package/
          cp -r config dist/package/

          tar -czvf "${ARCHIVE}" -C dist/package .
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            soundthis-*.tar.gz
            soundthis-*.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
