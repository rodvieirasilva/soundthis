name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils libpulse-dev

      - name: Start PulseAudio daemon for audio capture
        run: |
          pulseaudio -D --exit-idle-time=-1 || pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=dummy || true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: |
          cd web
          npm ci

      - name: Frontend Linter (ESLint)
        run: |
          cd web
          npm run lint

      - name: Frontend Tests & Coverage (Vitest >= 80%)
        run: |
          cd web
          npm run test:coverage

      - name: Build Web Bundle (Vite singlefile)
        run: |
          cd web
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Format Check (rustfmt)
        run: cargo fmt --check

      - name: Rust Linter (Clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust Tests & Coverage (cargo-llvm-cov >= 80%)
        run: cargo llvm-cov --summary-only

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Lifecycle E2E Test (Sandbox)
        run: ./tests/package/test-package-e2e.sh

      - name: Install Playwright Chromium & system dependencies
        run: |
          cd web
          npx playwright install --with-deps chromium

      - name: Browser Integration Tests (Playwright E2E)
        run: |
          cd web
          npm run test:e2e

  package-e2e-archlinux:
    name: Arch Linux Package Lifecycle E2E (Container)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Arch Linux Package Lifecycle E2E
        run: ./tests/package/test-package-e2e.sh --docker
