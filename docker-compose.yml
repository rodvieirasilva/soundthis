services:
  soundthis:
    build:
      context: .
      dockerfile: Dockerfile
    image: soundthis:latest
    container_name: soundthis
    network_mode: host
    environment:
      - PULSE_SERVER=unix:/tmp/pulse/native
    volumes:
      # Mount host PipeWire / PulseAudio socket for desktop audio capture
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/tmp/pulse/native:ro
      # Optional PulseAudio cookie if authentication is enabled
      - ${HOME}/.config/pulse/cookie:/root/.config/pulse/cookie:ro
    restart: unless-stopped
