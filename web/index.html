<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SoundThis • Omarchy Audio Stream</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/>
            <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/>
            <circle cx="12" cy="12" r="2"/>
            <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/>
            <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>SoundThis</h1>
          <span>Omarchy Audio Broadcast</span>
        </div>
      </div>
      <div id="status-badge" class="status-badge connecting">
        <span class="dot">⟳</span> Connecting...
      </div>
    </div>

    <div class="visualizer-container">
      <canvas id="visualizer"></canvas>
    </div>

    <div class="controls-card">
      <button id="play-btn" class="btn-primary paused">
        <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
        <span id="play-btn-text">Listen Live</span>
      </button>

      <div class="volume-section">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1.0">
        <span id="volume-text" class="volume-percent">100%</span>
      </div>

      <div class="meta-field">
        <label for="client-name-input">Client Name</label>
        <div class="name-input-wrapper">
          <input type="text" id="client-name-input" class="name-input" placeholder="e.g. My Phone, Living Room" maxlength="40">
        </div>
      </div>
    </div>

    <div class="footer">
      <span id="stats-text">48kHz Stereo • 16-bit PCM</span>
      <a href="https://github.com/soundthis" target="_blank" rel="noopener">v0.2.0</a>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
