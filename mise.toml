[tools]
rust = "1.99.1"
node = "26.13.0"

[tasks."build:web"]
description = "Compile the Vite frontend into web/dist/index.html"
dir = "web"
run = "npm run build"

[tasks."build:rust"]
description = "Compile the optimized Rust release binary"
depends = ["build:web"]
run = "cargo build --release"

[tasks.build]
description = "Build web bundle and release binary"
depends = ["build:web", "build:rust"]

[tasks."dev:web"]
description = "Run Vite development server"
dir = "web"
run = "npm run dev"

[tasks.dev]
description = "Run soundthis in dev mode with cargo"
run = "cargo run -- serve"

[tasks."test:web"]
description = "Run frontend unit tests with vitest"
dir = "web"
run = "npm test"

[tasks."test:e2e"]
description = "Run Playwright browser integration tests with Linux audio"
dir = "web"
run = "npm run test:e2e"

[tasks."screenshots:web"]
description = "Generate updated web player screenshots (desktop & mobile)"
depends = ["build"]
dir = "web"
run = "node scripts/capture-screenshots.mjs"

[tasks."screenshots:widget"]
description = "Capture live Omarchy desktop bar widget and popout panel screenshot"
run = "./scripts/capture-widget.sh"

[tasks.screenshots]
description = "Generate complete set of documentation screenshots (web & desktop widget)"
depends = ["screenshots:web", "screenshots:widget"]

[tasks."test:server"]
description = "Run Rust unit and integration tests"
run = "cargo test"

[tasks."test:package"]
description = "Run end-to-end package install, service enablement, and widget lifecycle tests"
run = "./tests/scripts/test-package-e2e.sh"

[tasks."test:package:docker"]
description = "Run real pacman and omarchy CLI install/drop lifecycle tests inside Arch Linux container"
run = "./tests/scripts/test-package-e2e.sh --docker"

[tasks.test]
description = "Run all web, server, and package lifecycle tests"
depends = ["test:web", "test:server", "test:package"]

[tasks."coverage:web"]
description = "Run frontend Vitest coverage (threshold >= 80%)"
dir = "web"
run = "npm run test:coverage"

[tasks."coverage:rust"]
description = "Run Rust cargo-llvm-cov coverage summary"
run = "cargo llvm-cov --summary-only"

[tasks.coverage]
description = "Run complete test coverage for frontend and backend"
depends = ["coverage:web", "coverage:rust"]

[tasks."lint:rust"]
description = "Run cargo clippy and rustfmt checks"
run = "cargo fmt --check && cargo clippy --all-targets -- -D warnings"

[tasks."lint:web"]
description = "Run ESLint checks on frontend TypeScript code"
dir = "web"
run = "npm run lint"

[tasks.lint]
description = "Run all linters for Rust and TypeScript"
depends = ["lint:rust", "lint:web"]

[tasks.fmt]
description = "Format Rust and web code"
run = "cargo fmt"

[tasks.install]
description = "Build and install binary, systemd user daemon, and Omarchy plugin"
depends = ["build"]
run = "cargo install --path . --force && soundthis install"

[tasks.uninstall]
description = "Stop daemon and cleanly remove Omarchy plugin and binary registration"
run = "soundthis uninstall"

[tasks.status]
description = "Check status of the running soundthis server"
run = "soundthis status"

[tasks.toggle]
description = "Toggle audio streaming on/off"
run = "soundthis toggle"

[tasks.open]
description = "Open the web player in the default browser"
run = "soundthis open"

[tasks."shell:restart"]
description = "Restart the Omarchy desktop shell to reload QML bar widgets"
run = "omarchy restart shell"

[tasks.reinstall]
description = "Compile release binary, update ~/.cargo/bin, reinstall service/plugin, and reload Omarchy shell"
depends = ["build"]
run = "cp --remove-destination target/release/soundthis ~/.cargo/bin/soundthis && soundthis install && omarchy restart shell"

[tasks."service:logs"]
description = "Tail systemd user service logs for soundthis"
run = "journalctl --user -u soundthis -f -n 50"

[tasks."service:restart"]
description = "Restart the systemd user service for soundthis"
run = "systemctl --user restart soundthis"

[tasks."service:status"]
description = "Check systemd user service status for soundthis"
run = "systemctl --user status soundthis"
